server:
  port: 8084

spring:
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:technology_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: always

allowed-origins: ${ALLOWED_ORIGIN:http://localhost:4200}

jwt.secret: ${JWT_SECRET:change-this-secret-change-this-secret-32bytes}

appDescription: "Pragma Reactive Technology"
appVersion: "1.0.0"
